<ion-content>
  <ion-grid class="ui-layout auth-layout">
    <ion-grid class="ui-layout auth-form">
      <ion-grid class="ui-layout page-heading">
        <ion-text class="ui-h1" role="heading" aria-level="1">Log in</ion-text>
        <ion-text class="ui-p">Enter an email and a sample password to try this screen.</ion-text>
      </ion-grid>
      <form #account="ngForm" (ngSubmit)="submit()">
        <ion-input
          label="Email address"
          labelPlacement="stacked"
          fill="outline"
          name="email"
          autocomplete="email"
          type="email"
          required
          email
          [(ngModel)]="email"
        ></ion-input>
        <ion-input
          label="Password"
          labelPlacement="stacked"
          fill="outline"
          name="password"
          autocomplete="current-password"
          type="password"
          required
          [(ngModel)]="password"
        ></ion-input>
        <ion-button type="submit" expand="block" [disabled]="account.invalid">Log in</ion-button>
      </form>
      <ion-text class="ui-p muted"
        >New to EVENTIFY?
        <ion-button class="ui-link" routerLink="/register" fill="clear">Create an account</ion-button></ion-text
      >
    </ion-grid>
    <ion-grid class="ui-layout auth-poster">
      <ion-img src="assets/login-concert.jpg" alt=""></ion-img>
      <ion-text class="ui-strong"
        >See you<ion-text class="ui-break" aria-hidden="true"></ion-text>at the show.</ion-text
      >
      <ion-text class="ui-span">EVENTIFY</ion-text>
    </ion-grid>
  </ion-grid>
</ion-content>
